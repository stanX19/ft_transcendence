# LibraryOS uses a container-generated, development-only self-signed
# certificate. The browser will show a trust warning on first visit; accept
# the local exception or import /etc/nginx/certs/localhost.crt into the local
# trust store for a persistent development setup.

server {
    listen 80;
    server_name localhost 127.0.0.1;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost 127.0.0.1;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # FastAPI enforces the application's 10 MB upload limit. Keep the proxy
    # slightly higher so Nginx does not reject valid API-side validation first.
    client_max_body_size 12m;

    location /api/ai/chat/stream {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    # No URI suffix on proxy_pass means the /api/ and /public-api/ prefixes
    # are preserved for FastAPI routing.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /public-api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API locations above are intentionally separate so API 404s stay JSON
    # responses instead of being rewritten to the frontend SPA.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
