<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102a43" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>LibraryOS · Offline</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f4f7fb; color: #102a43; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 34rem); border: 1px solid #cbd5e1; border-radius: 24px; background: #fff; padding: 40px; box-shadow: 0 18px 44px rgba(16, 42, 67, .1); }
      .eyebrow { color: #0b6fa4; font-size: .75rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 12px 0 0; font-size: clamp(2rem, 8vw, 3rem); line-height: 1.05; }
      p { color: #486581; line-height: 1.7; }
      button { margin-top: 12px; border: 0; border-radius: 12px; background: #102a43; color: #fff; cursor: pointer; font: inherit; font-weight: 700; padding: 12px 18px; }
      button:focus-visible { outline: 4px solid #b3ecff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main role="main" aria-labelledby="offline-title">
      <div class="eyebrow">LibraryOS</div>
      <h1 id="offline-title">You’re offline</h1>
      <p>The library shell is still available, but live catalog and account data need a connection. Reconnect and try again when you’re ready.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
