services:
  db:
    build:
      context: ./backend/db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-libraryos}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-libraryos_test}
      POSTGRES_USER: ${POSTGRES_USER:-libraryos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-libraryos_dev_password}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_DB: ${POSTGRES_DB:-libraryos}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-libraryos_test}
      POSTGRES_USER: ${POSTGRES_USER:-libraryos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-libraryos_dev_password}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://libraryos:libraryos_dev_password@db:5432/libraryos}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+psycopg://libraryos:libraryos_dev_password@db:5432/libraryos_test}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in .env}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-24}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-libraryos_session}
      PUBLIC_API_KEY: ${PUBLIC_API_KEY:?PUBLIC_API_KEY must be set in .env}
      PUBLIC_API_RATE_LIMIT_PER_MINUTE: ${PUBLIC_API_RATE_LIMIT_PER_MINUTE:-60}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEY_LIST: '${GEMINI_API_KEY_LIST:-[]}'
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-10}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-10}
      ONLINE_THRESHOLD_SECONDS: ${ONLINE_THRESHOLD_SECONDS:-120}
      LOAN_DAYS: ${LOAN_DAYS:-14}
      PAGE_SIZE_DEFAULT: ${PAGE_SIZE_DEFAULT:-20}
      PAGE_SIZE_MAX: ${PAGE_SIZE_MAX:-100}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DB_HOST: db
      DB_PORT: 5432
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: ./frontend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - certs_data:/etc/nginx/certs
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
  uploads_data:
  certs_data:
